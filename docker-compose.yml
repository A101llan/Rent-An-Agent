services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agenthub
      POSTGRES_PASSWORD: agenthub
      POSTGRES_DB: agenthub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenthub"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://agenthub:agenthub@postgres:5432/agenthub
      DATABASE_URL_SYNC: postgresql://agenthub:agenthub@postgres:5432/agenthub
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    command: >
      sh -c "alembic upgrade head &&
             python -m app.scripts.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  runtime-manager:
    build:
      context: ./apps/runtime-manager
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      RUNTIME_PROVIDER: docker
      AGENT_IMAGE: agenthub-demo-agent:latest
      DOCKER_NETWORK: agenthub-agents
    depends_on:
      redis:
        condition: service_healthy
      demo-agent-image:
        condition: service_completed_successfully
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./apps/runtime-manager:/app
    networks:
      - default
      - agenthub-agents
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  demo-agent-image:
    build:
      context: ./agents/demo-agent
      dockerfile: Dockerfile
    image: agenthub-demo-agent:latest
    command: ["echo", "image built"]
    networks:
      - agenthub-agents

  # Optional: OpenTelemetry collector (uncomment to enable tracing)
  jaeger:
    image: jaegertracing/all-in-one:1.62
    ports:
      - "4317:4317"
      - "16686:16686"

  worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL_SYNC: postgresql://agenthub:agenthub@postgres:5432/agenthub
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/worker:/app

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  postgres_data:
  minio_data:

networks:
  agenthub-agents:
    driver: bridge
